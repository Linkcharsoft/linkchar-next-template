name: CI

# The jobs live in Linkcharsoft/linkchar-frontend-workflows; Dependabot bumps the tag, so update them there, not here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: Linkcharsoft/linkchar-frontend-workflows/.github/workflows/next-ci.yml@v1.0.0

  dependabot:
    needs: ci
    if: ${{ !cancelled() && github.actor == 'dependabot[bot]' }}
    uses: Linkcharsoft/linkchar-frontend-workflows/.github/workflows/dependabot-review.yml@v1.0.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      ci-result: ${{ needs.ci.result }}
      automerge: ${{ vars.DEPENDABOT_AUTOMERGE || 'minor' }}
